name: sportmatch-backend

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      APP_NAME: "${APP_NAME:-SportMatch Gateway}"
      APP_VERSION: "${APP_VERSION:-0.1.0}"
      APP_ENV: "${APP_ENV:-development}"
      SERVICE_NAME: "${SERVICE_NAME:-sportmatch-gateway}"
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8000"
      AUTH_REQUIRED: "true"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_ISSUER: "${JWT_ISSUER:-sportmatch-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-sportmatch-mobile}"
      JWT_SECRET: "${JWT_SECRET:?Configure JWT_SECRET en .env}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:-}"
      JWT_LEEWAY_SECONDS: "${JWT_LEEWAY_SECONDS:-5}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,gateway,testserver}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      ENABLE_HSTS: "${ENABLE_HSTS:-false}"
      USERS_SERVICE_URL: "http://ms_users:8001"
      MATCHING_SERVICE_URL: "http://ms_matching:8002"
      ACTIVITIES_SERVICE_URL: "http://ms_activities:8003"
      # Opcional: sin CLUBS_SERVICE_URL las rutas de clubes y pagos responden 503.
      CLUBS_SERVICE_URL: "${CLUBS_SERVICE_URL:-}"
      USERS_TIMEOUT_SECONDS: "${USERS_TIMEOUT_SECONDS:-10}"
      NOTIFICATIONS_DATABASE_URL: "${USERS_DATABASE_URL:?Configure USERS_DATABASE_URL en .env}"
      MATCHING_DATABASE_URL: "${MATCHING_DATABASE_URL:?Configure MATCHING_DATABASE_URL en .env}"
      ACTIVITIES_DATABASE_URL: "${ACTIVITIES_DATABASE_URL:?Configure ACTIVITIES_DATABASE_URL en .env}"
      CLUBS_DATABASE_URL: "${CLUBS_DATABASE_URL:-}"
      PUSH_ENABLED: "${PUSH_ENABLED:-false}"
      EXPO_ACCESS_TOKEN: "${EXPO_ACCESS_TOKEN:-}"
    depends_on:
      ms_activities:
        condition: service_healthy
      ms_matching:
        condition: service_healthy
      ms_users:
        condition: service_healthy
    ports:
      # 127.0.0.1 por defecto. scripts/dev-lan.sh usa 0.0.0.0 para que un
      # teléfono con Expo Go en la misma red Wi-Fi pueda llegar al gateway.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=12)
      interval: 30s
      timeout: 15s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  ms_activities:
    build:
      context: ../Ms_Activities
    environment:
      ACTIVITIES_DATABASE_URL: "${ACTIVITIES_DATABASE_URL:?Configure ACTIVITIES_DATABASE_URL en .env}"
      JWT_SECRET: "${JWT_SECRET:?Configure JWT_SECRET en .env}"
      JWT_ISSUER: "${JWT_ISSUER:-sportmatch-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-sportmatch-mobile}"
      USERS_SERVICE_URL: "http://ms_users:8001"
      # Para validar matches al calificar, con el token del propio deportista.
      MATCHING_SERVICE_URL: "http://ms_matching:8002"
    depends_on:
      ms_users:
        condition: service_healthy
      ms_matching:
        condition: service_healthy
    expose:
      - "8003"
    restart: unless-stopped

  ms_matching:
    build:
      context: ../Ms_Matching
    environment:
      MATCHING_DATABASE_URL: "${MATCHING_DATABASE_URL:?Configure MATCHING_DATABASE_URL en .env}"
      JWT_SECRET: "${JWT_SECRET:?Configure JWT_SECRET en .env}"
      JWT_ISSUER: "${JWT_ISSUER:-sportmatch-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-sportmatch-mobile}"
      USERS_SERVICE_URL: "http://ms_users:8001"
      CHAT_ATTACHMENT_HOSTS: "${CHAT_ATTACHMENT_HOSTS:-}"
    depends_on:
      ms_users:
        condition: service_healthy
    expose:
      - "8002"
    restart: unless-stopped

  # Solo web. No es dependencia del gateway: si no arranca (p. ej. faltan migraciones),
  # el resto de la app sigue funcionando. Perfil "clubs": docker compose --profile clubs up
  ms_club:
    profiles: ["clubs"]
    build:
      context: ../ms-club
    environment:
      DB_HOST: "${CLUBS_DB_HOST:-host.docker.internal}"
      DB_PORT: "${CLUBS_DB_PORT:-5432}"
      DB_USER: "${CLUBS_DB_USER:-sportmatch_clubs}"
      DB_PASSWORD: "${CLUBS_DB_PASSWORD:?Configure CLUBS_DB_PASSWORD en .env}"
      DB_NAME: "${CLUBS_DB_NAME:-sportmatch_clubs}"
      JWT_SECRET: "${JWT_SECRET:?Configure JWT_SECRET en .env}"
      JWT_ISSUER: "${JWT_ISSUER:-sportmatch-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-sportmatch-mobile}"
      USERS_SERVICE_URL: "http://ms_users:8001"
      WEBPAY_MOCK_MODE: "${WEBPAY_MOCK_MODE:-false}"
      WEBPAY_ENVIRONMENT: "${WEBPAY_ENVIRONMENT:-INTEGRATION}"
      WEBPAY_WEB_RETURN_URL: "${WEBPAY_WEB_RETURN_URL:-http://localhost:3000/pago/resultado}"
      WEBPAY_COMMERCE_CODE: "${WEBPAY_COMMERCE_CODE:-}"
      WEBPAY_API_KEY: "${WEBPAY_API_KEY:-}"
      WEBPAY_PUBLIC_URL: "${WEBPAY_PUBLIC_URL:?Dirección del gateway que alcanza el navegador}"
      WEBPAY_FRONTEND_RETURN_URL: "${WEBPAY_FRONTEND_RETURN_URL:?Página del sitio web a la que vuelve el pago}"
    depends_on:
      ms_users:
        condition: service_healthy
    expose:
      - "8004"
    restart: unless-stopped

  users_migrate:
    build:
      context: ../Ms_Users
    image: sportmatch-ms-users:local
    environment:
      USERS_DATABASE_URL: "${USERS_DATABASE_URL:?Configure USERS_DATABASE_URL en .env}"
    command: ["python", "-m", "app.database.migrate"]
    restart: "no"

  ms_users:
    build:
      context: ../Ms_Users
    image: sportmatch-ms-users:local
    environment:
      USERS_DATABASE_URL: "${USERS_DATABASE_URL:?Configure USERS_DATABASE_URL en .env}"
      JWT_SECRET: "${JWT_SECRET:?Configure JWT_SECRET en .env}"
      JWT_ISSUER: "${JWT_ISSUER:-sportmatch-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-sportmatch-mobile}"
      JWT_ACCESS_TOKEN_MINUTES: "${JWT_ACCESS_TOKEN_MINUTES:-30}"
      # Recuperación de contraseña por correo (cualquier proveedor SMTP).
      EMAIL_BACKEND: "${EMAIL_BACKEND:-smtp}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_USE_STARTTLS: "${SMTP_USE_STARTTLS:-true}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-false}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      PASSWORD_RESET_CODE_MINUTES: "${PASSWORD_RESET_CODE_MINUTES:-15}"
      PASSWORD_RESET_MAX_ATTEMPTS: "${PASSWORD_RESET_MAX_ATTEMPTS:-5}"
      PASSWORD_RESET_RESEND_SECONDS: "${PASSWORD_RESET_RESEND_SECONDS:-60}"
      # Solo desarrollo y solo con EMAIL_BACKEND=console: cualquier código de 6 dígitos verifica el correo.
      EMAIL_VERIFICATION_ACCEPT_ANY_CODE: "${EMAIL_VERIFICATION_ACCEPT_ANY_CODE:-false}"
    depends_on:
      users_migrate:
        condition: service_completed_successfully
    expose:
      - "8001"
    restart: unless-stopped
