# Complemento local para Windows: agrega PostgreSQL en contenedor y ajusta las
# rutas de las carpetas de este equipo. Uso:
#   docker compose -f compose.yaml -f compose.windows.yaml up --build -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-SportmatchLocal2026}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-dbs.sql:/docker-entrypoint-initdb.d/01-init-dbs.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  users_migrate:
    depends_on:
      postgres:
        condition: service_healthy

  ms_matching:
    build:
      context: ../ms-machine
    depends_on:
      postgres:
        condition: service_healthy

  ms_activities:
    build:
      context: ../Ms_activities
    depends_on:
      postgres:
        condition: service_healthy

  # Crea el rol y la base de ms-club si faltan y aplica sus scripts (tablas base,
  # migraciones y planes de prueba). Termina con código 0.
  clubs_migrate:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-SportmatchLocal2026}"
      CLUBS_DB_PASSWORD: "${CLUBS_DB_PASSWORD:?Configure CLUBS_DB_PASSWORD en .env}"
    volumes:
      - ../Ms-club/db:/clubs-db:ro
      - ./docker/clubs-migrate.sh:/clubs-migrate.sh:ro
    entrypoint: ["sh", "/clubs-migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # En Windows ms-club corre siempre (sin el perfil "clubs") contra el PostgreSQL del contenedor.
  ms_club:
    profiles: !reset []
    build:
      context: ../Ms-club
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      clubs_migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
